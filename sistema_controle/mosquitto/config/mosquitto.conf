# Configuração geral
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Segurança
allow_anonymous false
password_file /mosquitto/config/password.txt

# Logs
log_type error
log_type warning
log_type notice
log_type information
