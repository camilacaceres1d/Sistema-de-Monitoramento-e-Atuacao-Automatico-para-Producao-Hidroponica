services:
  database:
    image: postgres:15-alpine
    container_name: hidroponia_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hidroponia_db}
      POSTGRES_USER: ${POSTGRES_USER:-hidroponia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hidroponia_user} -d ${POSTGRES_DB:-hidroponia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - mqtt-network

networks:
  mqtt-network:
    driver: bridge

volumes:
  db_data:
